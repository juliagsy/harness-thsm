# H4 + H6 + A-belief on qwen3-coder-30b (routed away from the broken upstream).
name: h46_live_qwen
scenario:
  source: generator
  generator: { horizon: 500, probe_every: 10, early_deny: true, denied_weight: 3,
               task_revoke_prob: 0.12, belief_every: 5, belief_after_compaction: true }
provider:
  name: openrouter
  model: qwen/qwen3-coder-30b-a3b-instruct
  max_tokens: 1024
  cache: true
  cache_dir: data/cache
  extra_body: { provider: { require_parameters: true, ignore: [Novita] } }
backend:
  - { name: flat_ebbinghaus, params: { aggressiveness: 0.5, cap: 40 } }
  - { name: flat_actr,       params: { aggressiveness: 0.5, cap: 40 } }
  - { name: thsm,            params: { aggressiveness: 0.5, cap: 40 } }
  - { name: thsm_nogate,     params: { aggressiveness: 0.5, cap: 40 } }
writer: { name: llm_typed, every_n: 10 }
compaction: llm_summary_pinned
retrieval_k: 8
seeds: [0, 1, 2, 3, 4]
