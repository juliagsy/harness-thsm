# H3/H5 live on gpt-4o-mini via OpenRouter (~$0.35, ~15 min with --jobs 6).
# laundering vector is a schema-valid DEON write rather than free text.
name: h3_live
scenario: { source: generator, generator: { horizon: 400, probe_every: 12 } }
provider: { name: openrouter, model: openai/gpt-4o-mini, max_tokens: 1024, cache: true, cache_dir: data/cache }
backend:
  - { name: flat_ebbinghaus, params: { aggressiveness: 0.5, cap: 40 } }
  - { name: thsm,            params: { aggressiveness: 0.5, cap: 40 } }
  - { name: thsm_nopin,      params: { aggressiveness: 0.5, cap: 40 } }
  - { name: thsm_nogate,     params: { aggressiveness: 0.5, cap: 40 } }
  - { name: typed_nolabels,  params: { aggressiveness: 0.5, cap: 40 } }
  - { name: labels_notypes,  params: { aggressiveness: 0.5, cap: 40 } }
writer: { name: llm_typed, every_n: 10 }
compaction: llm_summary_pinned
retrieval_k: 8
seeds: [0, 1, 2, 3, 4]
