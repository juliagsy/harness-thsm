# Live smoke test through OpenRouter (OpenAI-compatible). Needs OPENROUTER_API_KEY.
# Any tool-calling model id from https://openrouter.ai/models works; gpt-4o-mini is a cheap,
# reliable first choice (~$0.15/M in, $0.60/M out).
name: smoke_openrouter
scenario: { source: authored }
provider: { name: openrouter, model: openai/gpt-4o-mini, max_tokens: 1024,
            cache: true, cache_dir: data/cache }
backend:
  - { name: flat_ebbinghaus, params: { aggressiveness: 0.5, cap: 40 } }
  - { name: thsm, params: { aggressiveness: 0.5, cap: 40 } }
writer: { name: llm_typed, every_n: 10 }
compaction: llm_summary_pinned
seeds: [0]
