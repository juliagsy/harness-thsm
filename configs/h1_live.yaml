# H1 live on gpt-4o-mini via OpenRouter (~$1.20, ~45 min with --jobs 6).
# Type-blind backends sweep decay aggressiveness; THSM sweeps the same knob but its
# deontic state is exempt from decay by construction.
name: h1_live
scenario: { source: generator, generator: { horizon: 400, probe_every: 12 } }
provider: { name: openrouter, model: openai/gpt-4o-mini, max_tokens: 1024, cache: true, cache_dir: data/cache }
sweep:
  backends: [flat_ebbinghaus, flat_actr, flat_memworth, thsm]
  params: { aggressiveness: [0.0, 0.25, 0.5, 0.75, 1.0] }
  base_params: { cap: 40 }
writer: { name: llm_freeform, every_n: 10, max_notes: 10 }
compaction: llm_summary
retrieval_k: 8
seeds: [0, 1, 2, 3, 4]
